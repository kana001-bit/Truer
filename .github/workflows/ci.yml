name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    # slnt をサブプロセスで起動する経路は OS 依存で、Windows 専用テスト（.cmd の spawn、パス中の
    # %VAR%、名前のメタ文字。test/slntRunner.test.ts）は process.platform !== "win32" で skip される。
    # ubuntu だけで回すとそれらが一度も走らないので、両 OS を matrix で回して実際に検証する。
    runs-on: ${{ matrix.os }}
    strategy:
      # 片方が落ちても、もう片方の結果を捨てない（OS 固有の失敗かを切り分けるため）。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          cache: npm
      - run: npm ci
      # lint / format は OS 非依存なので ubuntu の 1 本だけで足りる（二重実行しない）。
      - run: npm run lint
        if: matrix.os == 'ubuntu-latest'
      - run: npm run format:check
        if: matrix.os == 'ubuntu-latest'
      # `npm test` runs pretest (typecheck + build) before node --test.
      - run: npm test
      # 利用者が受け取るのはリポジトリではなく npm の tarball。npm pack で作った tarball を
      # リポジトリ外の空ディレクトリに入れ、入れた tru が起動するかを見る
      # （files の漏れ・bin/shebang の壊れ・dist 不在は、上の test では見つからない）。
      - name: Packed install smoke test
        shell: bash
        run: |
          tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/$tarball"
          npx --no-install tru --help
